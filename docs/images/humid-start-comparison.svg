<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
<title id="title">Humid Start compared with stock firmware</title>
<desc id="desc">Two charts of relative humidity at the mask and tube temperature over the first minutes of therapy with a 30 degree tube setting. With stock firmware the tube reaches its setting long before the air reaches 85 percent RH. With Humid Start the tube follows the water and RH reaches 85 percent sooner.</desc>
<style>.bg{fill:#fbfaf5}.grid{stroke:#d9d6ca;stroke-width:1}.axis{stroke:#9b988c;stroke-width:1}.ref{stroke:#8a877b;stroke-width:1.2;stroke-dasharray:5 4}.rh,.tube{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.rh{stroke:#2a78d6}.tube{stroke:#eb6834}.title{font:500 15px sans-serif;fill:#263238}.sub{font:12px sans-serif;fill:#5a6a70}</style>
<rect class="bg" width="760" height="640" rx="8"/>
<text x="24" y="26" class="title">Stock firmware: the tube is at its 30 °C setting long before the air reaches 85 % RH</text>
<line x1="24" y1="52" x2="46" y2="52" class="rh"/><text x="52" y="56" class="sub">RH at the mask (left axis)</text>
<line x1="238" y1="52" x2="260" y2="52" class="tube"/><text x="266" y="56" class="sub">Tube temperature (right axis)</text>
<line x1="64" y1="272.0" x2="696" y2="272.0" class="axis"/>
<text x="56" y="276.0" class="sub" text-anchor="end">0%</text>
<text x="704" y="276.0" class="sub">15°C</text>
<line x1="64" y1="227.0" x2="696" y2="227.0" class="grid"/>
<text x="56" y="231.0" class="sub" text-anchor="end">25%</text>
<text x="704" y="231.0" class="sub">20°C</text>
<line x1="64" y1="182.0" x2="696" y2="182.0" class="grid"/>
<text x="56" y="186.0" class="sub" text-anchor="end">50%</text>
<text x="704" y="186.0" class="sub">25°C</text>
<line x1="64" y1="137.0" x2="696" y2="137.0" class="grid"/>
<text x="56" y="141.0" class="sub" text-anchor="end">75%</text>
<text x="704" y="141.0" class="sub">30°C</text>
<line x1="64" y1="92.0" x2="696" y2="92.0" class="grid"/>
<text x="56" y="96.0" class="sub" text-anchor="end">100%</text>
<text x="704" y="96.0" class="sub">35°C</text>
<line x1="64" y1="119.0" x2="696" y2="119.0" class="ref"/><text x="72" y="113.0" class="sub">Target RH 85 %</text>
<line x1="64" y1="137.0" x2="696" y2="137.0" class="ref"/><text x="688" y="157.0" class="sub" text-anchor="end">Tube setting 30 °C</text>
