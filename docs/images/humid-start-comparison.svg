<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
<title id="title">Humid Start compared with stock firmware, with and without Min Tube</title>
<desc id="desc">Three charts of relative humidity at the mask and tube temperature over the first minutes of therapy in an 18 degree room with a 30 degree tube setting. With stock firmware the tube reaches its setting long before the air reaches 85 percent RH. With Humid Start the tube stays at room temperature until the water can support the target, so RH reaches 85 percent sooner. With Min Tube set to 20 degrees the tube heats to 20 degrees at once and then follows the water.</desc>
<style>.bg{fill:#fbfaf5}.grid{stroke:#d9d6ca;stroke-width:1}.axis{stroke:#9b988c;stroke-width:1}.ref{stroke:#8a877b;stroke-width:1.2;stroke-dasharray:5 4}.rh,.tube{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.rh{stroke:#2a78d6}.tube{stroke:#eb6834}.title{font:500 15px sans-serif;fill:#263238}.sub{font:12px sans-serif;fill:#5a6a70}</style>
<rect class="bg" width="760" height="960" rx="8"/>
